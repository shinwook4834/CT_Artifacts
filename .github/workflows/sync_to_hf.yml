name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          if not token:
              raise ValueError('HF_TOKEN secret is not set in repository settings.')

          api = HfApi(token=token)
          api.upload_folder(
              folder_path='.',
              repo_id='shinwook4834/CTAF',
              repo_type='space',
              ignore_patterns=['.git*', '.github*', '*.pdf', '*.docx']
          )
          print('Successfully synced repository to Hugging Face Space!')
          "
